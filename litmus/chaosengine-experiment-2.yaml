apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: otel-lab-pod-failure
  namespace: otel-lab
spec:
  appinfo:
    appns: otel-lab
    applabel: "app=data-service"
    appkind: deployment
  chaosServiceAccount: litmus-admin
  engineState: active
  experiments:
    - name: pod-delete
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "120"
            - name: CHAOS_INTERVAL
              value: "30"
            - name: FORCE
              value: "false"
            - name: PODS_AFFECTED_PERC
              value: "50"
            - name: CONTAINER_RUNTIME
              value: "containerd"
            - name: SOCKET_PATH
              value: "/run/containerd/containerd.sock"
        probe:
          - name: data-service-healthy-before
            type: httpProbe
            mode: SOT
            httpProbe/inputs:
              url: "http://data-service-svc:8002/health"
              method:
                get:
                  criteria: ==
                  responseCode: "200"
            runProperties:
              probeTimeout: 5s
              interval: 2s
              attempt: 3
          - name: inventory-metrics-during-chaos
            type: promProbe
            mode: OnChaos
            promProbe/inputs:
              endpoint: "http://prometheus-svc:9090"
              query: otelcol_inventory_query_duration_seconds_count
              comparator:
                criteria: ">="
                value: "0"
            runProperties:
              probeTimeout: 60s
              interval: 10s
              attempt: 12
          - name: data-service-recovered-after
            type: httpProbe
            mode: EOT
            httpProbe/inputs:
              url: "http://data-service-svc:8002/health"
              method:
                get:
                  criteria: ==
                  responseCode: "200"
            runProperties:
              probeTimeout: 60s
              interval: 10s
              attempt: 6